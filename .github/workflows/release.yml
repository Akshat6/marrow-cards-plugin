name: Publish Marrow Cards release
on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - tests/smoke.js
      - tests/dynamic-smoke.js
      - tests/dynamic-integration.js
      - tests/live-groq-eval.js
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin assets
        run: |
          set -euo pipefail
          node --check main.js
          node tests/smoke.js
          node --check tests/pyq-style-smoke.js
          node --check tests/pyq-style-multi-index-audit.js
          node --check tests/pyq-style-experimental-integration.js
          node tests/pyq-style-smoke.js
          node tests/pyq-style-multi-index-audit.js
          node tests/pyq-style-experimental-integration.js
          node --check tests/dynamic-smoke.js
          node --check tests/dynamic-integration.js && node --check tests/dynamic-hierarchy-mobile.js && node --check tests/dynamic-progress-sync.js
          node --check tests/live-groq-eval.js
          node tests/dynamic-smoke.js
          node tests/dynamic-integration.js
          node tests/dynamic-hierarchy-mobile.js
          node tests/dynamic-progress-sync.js
          node tests/live-groq-eval.js --dry-run
          node -e "const m=require('./manifest.json');if(m.id!=='marrow-cards'||!m.version.match(/^[0-9]+[.][0-9]+[.][0-9]+$/))process.exit(1)"
          test -s styles.css
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists. Bump manifest version for later updates."
            exit 0
          fi
          gh release create "$VERSION" main.js manifest.json styles.css \
            --title "$VERSION" --target "$GITHUB_SHA" \
            --notes "Marrow Cards $VERSION introduces opt-in Experimental AI MCQs in Dynamic Recall → choose index → PYQ-style. Questions are dynamically generated with Groq from original Verified KU facts, can bridge multiple original source indexes with exactly one home index, and are explicitly NOT independently medically certified. Model answers, flags and attempts stay separate from verified learning scores and genuine historical PYQ Review. A private read-only GitHub token, downloaded Knowledge Units and a Groq key are needed. Existing packs, notes, reviews, media, device identities and score histories are unchanged; back up the vault before updating. Prior 0.3.11 remains available for rollback."
