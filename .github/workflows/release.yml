name: Publish Marrow Cards release
on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - tests/smoke.js
      - tests/dynamic-smoke.js
      - tests/dynamic-integration.js
      - tests/live-groq-eval.js
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin assets
        run: |
          set -euo pipefail
          node --check main.js
          node tests/smoke.js
          node --check tests/dynamic-smoke.js
          node --check tests/dynamic-integration.js && node --check tests/dynamic-hierarchy-mobile.js
          node --check tests/live-groq-eval.js
          node tests/dynamic-smoke.js
          node tests/dynamic-integration.js
          node tests/dynamic-hierarchy-mobile.js
          node tests/live-groq-eval.js --dry-run
          node -e "const m=require('./manifest.json');if(m.id!=='marrow-cards'||!m.version.match(/^[0-9]+[.][0-9]+[.][0-9]+$/))process.exit(1)"
          test -s styles.css
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists. Bump manifest version for later updates."
            exit 0
          fi
          gh release create "$VERSION" main.js manifest.json styles.css \
            --title "$VERSION" --target "$GITHUB_SHA" \
            --notes "Marrow Cards $VERSION: direct Integrated Pulmonology Review/Browse collection without source-subject subdivisions, with existing KU score history preserved. Dynamic Recall home now shows local grading/API-request headroom, measured token totals and an estimated remaining-question capacity (not a guaranteed Groq account quota). Source subjects still use their own index hierarchy, PYQ Review remains intact. Back up vault; v0.3.1/v0.3.0/v0.2.10 remain available for rollback."
