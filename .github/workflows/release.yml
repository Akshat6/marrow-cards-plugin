name: Publish Marrow Cards release
on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - tests/smoke.js
      - tests/daily-quest.js
      - tests/dynamic-smoke.js
      - tests/dynamic-integration.js
      - tests/dynamic-flagged-units.js
      - tests/live-groq-eval.js
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin assets
        run: |
          set -euo pipefail
          node --check main.js
          node tests/smoke.js
          node tests/daily-quest.js
          node --check tests/pyq-style-smoke.js
          node --check tests/pyq-style-multi-index-audit.js
          node --check tests/pyq-style-experimental-integration.js
          node tests/pyq-style-smoke.js
          node tests/pyq-style-multi-index-audit.js
          node tests/pyq-style-experimental-integration.js
          node tests/pyq-style-feedback-sync.js
          node --check tests/dynamic-smoke.js
          node --check tests/dynamic-integration.js && node --check tests/dynamic-hierarchy-mobile.js && node --check tests/dynamic-progress-sync.js
          node --check tests/live-groq-eval.js
          node tests/dynamic-smoke.js
          node tests/dynamic-integration.js
          node tests/dynamic-flagged-units.js
          node tests/dynamic-hierarchy-mobile.js
          node tests/dynamic-progress-sync.js
          node tests/live-groq-eval.js --dry-run
          node -e "const m=require('./manifest.json');if(m.id!=='marrow-cards'||!m.version.match(/^[0-9]+[.][0-9]+[.][0-9]+$/))process.exit(1)"
          test -s styles.css
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists. Bump manifest version for later updates."
            exit 0
          fi
          gh release create "$VERSION" main.js manifest.json styles.css \
            --title "$VERSION" --target "$GITHUB_SHA" \
            --notes "Marrow Cards $VERSION: activate explicitly authorized notes-only Dynamic Recall units while preserving source status. Flagged questions show a verify notice before answering; reference answers and AI scores remain provisional, with source reasons revealed after grading. Shared Integrated/source KU history is preserved. Existing experimental PYQ catalogs retain their strict original Verified subset. Automated synthetic regression tests passed; real Groq and Android validation remain pending. Update through BRAT, then Check knowledge units on GitHub."
