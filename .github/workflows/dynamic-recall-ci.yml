name: Dynamic Recall branch verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript syntax
        run: node --check main.js && node --check tests/smoke.js && node --check tests/dynamic-smoke.js
      - name: Legacy PYQ reviewer regression tests
        run: node tests/smoke.js
      - name: Isolated Dynamic Recall regression tests
        run: node tests/dynamic-smoke.js
      - name: Ensure installed plugin manifest is unchanged during development
        run: |
          node -e "const m=require('./manifest.json'); if(m.version !== '0.2.10') process.exit(1)"
          git diff origin/main...HEAD -- manifest.json | grep -q . && exit 1 || true
