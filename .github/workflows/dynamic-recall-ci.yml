name: Dynamic Recall branch verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript syntax
        run: node --check main.js && node --check tests/smoke.js && node --check tests/dynamic-smoke.js && node --check tests/dynamic-integration.js && node --check tests/dynamic-hierarchy-mobile.js && node --check tests/dynamic-progress-sync.js && node --check tests/live-groq-eval.js
      - name: Legacy PYQ reviewer regression tests
        run: node tests/smoke.js
      - name: Isolated Dynamic Recall regression tests
        run: node tests/dynamic-smoke.js
      - name: Repeat-session Dynamic Recall integration (synthetic Groq)
        run: node tests/dynamic-integration.js
      - name: Mobile keyboard and subject/integrated hierarchy regressions
        run: node tests/dynamic-hierarchy-mobile.js
      - name: Verify compact sync behavior with local tests
        run: node tests/dynamic-progress-sync.js
      - name: Verify real-Groq test harness without a secret or API calls
        run: node tests/live-groq-eval.js --dry-run
      - name: Daily Quest lightweight reviewer regression
        run: node tests/daily-quest.js
      - name: Verify semantic version and unchanged plugin ID
        run: |
          node -e "const m=require('./manifest.json'); if(!/^\\d+\\.\\d+\\.\\d+$/.test(m.version)||m.id !== 'marrow-cards') process.exit(1)"
